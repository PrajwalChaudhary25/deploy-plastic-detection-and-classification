<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Inference Result</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4">
        <h1 class="text-4xl font-bold mb-6 text-center text-gray-900">Photo Inference Result</h1>
        <section class="bg-white border border-gray-200 p-8 rounded-md">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                <h2 id="summary" class="text-2xl font-semibold text-green-700"></h2>
                <a href="{{ url_for('index') }}" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-700 transition duration-300">Analyze another photo</a>
            </div>
            <div id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <p id="emptyState" class="hidden text-center text-gray-600">No detections were found in this photo.</p>
        </section>
    </div>
    <script>
        var results = document.getElementById('results');
        var summary = document.getElementById('summary');
        var emptyState = document.getElementById('emptyState');
        var storedResult = sessionStorage.getItem('photoInference');

        if (!storedResult) {
            summary.textContent = 'No inference result available';
            emptyState.textContent = 'Upload a photo first.';
            emptyState.classList.remove('hidden');
        } else {
            var inference = JSON.parse(storedResult);
            var detections = inference.detections || [];
            summary.textContent = detections.length + ' detection' + (detections.length === 1 ? '' : 's') + ' found';
            if (detections.length === 0) {
                emptyState.classList.remove('hidden');
            }

            var image = new Image();
            image.onload = function() {
                detections.forEach(function(detection, index) {
                    createDetectionCard(image, detection, index);
                });
            };
            image.src = inference.image;
        }

        function createDetectionCard(image, detection, index) {
            var coordinates = detection.bbox.map(function(value) {
                return Math.max(0, Math.round(value));
            });
            var x1 = coordinates[0];
            var y1 = coordinates[1];
            var x2 = Math.min(image.naturalWidth, coordinates[2]);
            var y2 = Math.min(image.naturalHeight, coordinates[3]);
            var cropWidth = Math.max(1, x2 - x1);
            var cropHeight = Math.max(1, y2 - y1);

            var card = document.createElement('article');
            card.className = 'border border-gray-200 rounded-md p-4 bg-gray-50';

            var title = document.createElement('h3');
            title.className = 'text-lg font-bold text-green-700 mb-3';
            title.textContent = detection.class + ' - ' + Math.round(detection.confidence * 100) + '%';

            var canvas = document.createElement('canvas');
            canvas.width = cropWidth;
            canvas.height = cropHeight;
            canvas.className = 'w-full h-auto rounded bg-gray-200';
            canvas.title = 'Detection ' + (index + 1);
            canvas.getContext('2d').drawImage(image, x1, y1, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

            card.appendChild(title);
            card.appendChild(canvas);
            results.appendChild(card);
        }
    </script>
</body>
</html>
